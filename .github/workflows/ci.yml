name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.11", "3.15"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        # When the runner can't resolve Ubuntu's own archive hosts (their DNS has failed for hours at a time),
        # kernel.org's mirror of it: apt checks Ubuntu's signatures on whatever it's served, from any mirror.
        run: |
          packages=(libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3)
          if ! { sudo apt-get update && sudo apt-get install -y "${packages[@]}"; }; then
            echo "::warning::Ubuntu's archive is out of reach; trying kernel.org's mirror of it"
            sudo sed -i -E 's#^URIs:.*#URIs: http://mirrors.edge.kernel.org/ubuntu/#' /etc/apt/sources.list.d/ubuntu.sources
            sudo apt-get update && sudo apt-get install -y "${packages[@]}"
          fi
      - run: python -m pip install PyQt6 psutil pytest
      - run: python -m pytest -q
      - name: What Chatmon tells AppKit itself, on macOS's real window server
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: python -m pytest -q tests/test_macnative.py
