name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.11", "3.15"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        # The runner image has them already; apt makes sure. When the runner can't reach Ubuntu's archive (its
        # DNS has failed for hours at a time), go on only if every one of them really is here.
        run: |
          if ! { sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3; }; then
            echo "::warning::Ubuntu's archive is out of reach; using the libraries the runner image already has"
            for lib in libEGL.so.1 libGL.so.1 libxkbcommon.so.0 libfontconfig.so.1 libdbus-1.so.3; do
              ldconfig -p | grep -q "$lib" || { echo "$lib is missing"; exit 1; }
            done
          fi
      - run: python -m pip install PyQt6 psutil pytest
      - run: python -m pytest -q
