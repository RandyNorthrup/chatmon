name: Packages

# Chatmon's installers and packages, each installed on a fresh machine and run before it's kept:
# Windows (Inno Setup), macOS (.pkg and .dmg, Apple silicon and Intel), Linux (.deb and .rpm), and the
# wheel and sdist. Publishing a release adds them all to it; a pull request that touches packaging, or
# running this by hand, only builds and checks them (they're kept with the run).
on:
  release:
    types: [published]
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: The release is the version the code says
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python packaging/build.py version)
          [ "$TAG" = "v$version" ] || { echo "Release $TAG, but chatmon/__init__.py says $version"; exit 1; }
      - run: python -m pip install build==1.6.1
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r packaging/requirements.txt
      - name: Inno Setup 6.7.3, checked to be signed by its maker
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download is-6_7_3 --repo jrsoftware/issrc --pattern innosetup-6.7.3.exe --dir $env:RUNNER_TEMP
          $setup = Join-Path $env:RUNNER_TEMP innosetup-6.7.3.exe
          $sig = Get-AuthenticodeSignature $setup
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notlike "CN=Pyrsys B.V.*") { throw "Unexpected signature: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/SP-" -Wait
      - run: python packaging/build.py windows
      - name: Install it, run it, uninstall it
        shell: pwsh
        run: |
          $version = python packaging/build.py version
          ./packaging/windows/test-install.ps1 (Get-Item dist/Chatmon-*-windows-x64-setup.exe).FullName $version
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]  # Apple silicon, Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r packaging/requirements.txt
      - run: python packaging/build.py macos
      - name: Install the .pkg, run it
        run: |
          sudo installer -pkg dist/Chatmon-*.pkg -target /
          test -x /usr/local/bin/chatmon
          python packaging/build.py smoke /usr/local/bin/chatmon /Applications/Chatmon.app/Contents/MacOS/Chatmon --version "$(python packaging/build.py version)"
      - name: The .dmg holds the app
        run: |
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/Chatmon-*.dmg
          test -x "$mount/Chatmon.app/Contents/MacOS/Chatmon" && test -L "$mount/Applications"
          hdiutil detach "$mount"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.runner }}
          path: |
            dist/*.pkg
            dist/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo sh packaging/linux/get-nfpm.sh
      - run: python3 packaging/build.py linux
      - name: Install each on a fresh system, run it, remove it
        run: |
          version=$(python3 packaging/build.py version)
          for image in ubuntu:24.04 debian:trixie; do
            echo "::group::$image"
            docker run --rm -v "$PWD:/src:ro" "$image" sh -ec "
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /src/dist/chatmon_*_all.deb >/dev/null
              python3 /src/packaging/build.py smoke chatmon chatmon --version $version
              apt-get remove -y -qq chatmon >/dev/null
              test ! -e /usr/lib/chatmon"
            echo "::endgroup::"
          done
          echo "::group::fedora:44"
          docker run --rm -v "$PWD:/src:ro" fedora:44 sh -ec "
            dnf install -y -q /src/dist/chatmon-*.noarch.rpm >/dev/null
            python3 /src/packaging/build.py smoke chatmon chatmon --version $version
            dnf remove -y -q chatmon >/dev/null
            test ! -e /usr/lib/chatmon"
          echo "::endgroup::"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: [python, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
