name: Packages

# Chatmon's installers and packages, each installed on a fresh machine and run before it's kept:
# Windows (Inno Setup), macOS (.pkg and .dmg, Apple silicon and Intel), Linux (.deb and .rpm), and the
# wheel and sdist. Pushing a v* tag releases them: the Windows installer is signed, every file's checksum is
# signed, each file gets a build provenance attestation, and they're all attached to a draft release, which is
# published only once every file is on it. A pull request that touches packaging, or running this by hand,
# only builds and checks them, unsigned (they're kept with the run); run by hand from a v* tag, it signs too,
# without releasing. Actions are pinned to commits and Python tools hash-locked (packaging/requirements*.txt):
# what runs here can't change under a tag. Each build is dated by its commit (SOURCE_DATE_EPOCH), so building
# the same commit again makes the same wheel.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "tests/test_package_data.py"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request stops the run it replaces; a release's run always finishes.
  group: packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: The tag is the version the code says
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python packaging/build.py version)
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG, but chatmon/__init__.py says $version"; exit 1; }
          python packaging/build.py notes "$version" > /dev/null  # what's new in it, which Chatmon shows after updating
      - &source-date
        name: Date the build by its commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: python -m pip install --require-hashes -r packaging/requirements-build.txt
      - run: python -m build --no-isolation  # with the hash-locked setuptools just installed
      - run: python -m twine check --strict dist/*
      - name: The wheel and sdist hold every file of chatmon the repository tracks
        env:
          CHATMON_DIST: dist
        run: python -m pytest -p no:cacheprovider tests/test_package_data.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-python
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 90  # Nuitka compiles Chatmon twice: chatmon.exe and chatmonw.exe
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - *source-date
      - &build-tools
        name: What the installers are built with, hash-locked
        # Nuitka comes as source, built here with the hash-locked setuptools and wheel installed first: pip's own
        # build isolation would fetch them unchecked.
        run: |
          python -m pip install --require-hashes -r packaging/requirements-build.txt
          python -m pip install --require-hashes --no-build-isolation -r packaging/requirements.txt
      - &inno-setup
        name: Inno Setup 6.7.3, checked to be signed by its maker
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download is-6_7_3 --repo jrsoftware/issrc --pattern innosetup-6.7.3.exe --dir $env:RUNNER_TEMP
          $setup = Join-Path $env:RUNNER_TEMP innosetup-6.7.3.exe
          $sig = Get-AuthenticodeSignature $setup
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notlike "CN=Pyrsys B.V.*") { throw "Unexpected signature: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/SP-" -Wait
      - run: python packaging/build.py windows
      - id: version
        shell: pwsh
        run: '"version=$(python packaging/build.py version)" >> $env:GITHUB_OUTPUT'
      - name: The last release's installer, for this one to upgrade
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select((.draft | not) and any(.assets[]; .name | endswith("-windows-x64-setup.exe")))][0].tag_name')
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "*-windows-x64-setup.exe" --dir "$RUNNER_TEMP/last"
      - name: Install the last release, update it to this one, run it, uninstall it
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $last = Get-Item "$env:RUNNER_TEMP\last\*-windows-x64-setup.exe"
          $p = Start-Process $last.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/TASKS=startmenu" -Wait -PassThru
          if ($p.ExitCode) { throw "$($last.Name) failed: $($p.ExitCode)" }
          Write-Host "Installed $($last.Name)"
          # Then this one, as Chatmon's updater runs it: silently, as the last install was, and Chatmon starts again.
          $env:QT_QPA_PLATFORM = "offscreen"
          $setup = (Get-Item dist/Chatmon-*-windows-x64-setup.exe).FullName
          # Not Start-Process -Wait: that waits for what the installer starts too, and it starts Chatmon again.
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/relaunch=1" -PassThru
          $p.WaitForExit()
          if ($p.ExitCode) { throw "Updating failed: $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\Chatmon"
          for ($i = 0; $i -lt 30 -and -not (Get-Process chatmonw -ErrorAction SilentlyContinue | Where-Object Path -eq "$app\chatmonw.exe"); $i++) { Start-Sleep 1 }
          if (-not (Get-Process chatmonw -ErrorAction SilentlyContinue | Where-Object Path -eq "$app\chatmonw.exe")) { throw "Chatmon didn't start again after updating" }
          if ((& "$app\chatmon.exe" --version) -ne $env:VERSION) { throw "Not updated to $env:VERSION" }
          & "$app\chatmon.exe" quit
          for ($i = 0; $i -lt 30 -and (Get-Process chatmonw -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          Write-Host "Updated to $env:VERSION and started again"
          Remove-Item Env:QT_QPA_PLATFORM
          ./packaging/windows/test-install.ps1 $setup $env:VERSION -Unsigned
      - name: Keep the unsigned installer with the run
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: dist/*.exe
          if-no-files-found: error
      - name: Hand on Chatmon, for its installer to be built signed
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app
          path: build/nuitka/Chatmon
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Signs Chatmon's programs, chatmon.exe and chatmonw.exe, and every library beside them not already
  # signed by its maker, then has Inno Setup build the installer around them again and sign it and its
  # uninstaller as it makes them: all with Randy Northrup's Artifact Signing certificate (Azure). This job
  # alone can sign, and runs nothing from PyPI and none of Chatmon: only pinned actions, Inno Setup and
  # Microsoft's signing module (each checked to be signed by its maker, and the module fetches Microsoft's
  # signtool at the versions it names), compiling packaging/windows/chatmon.iss. Azure trusts GitHub's
  # sign-in only from the `release` environment, which only v* tags can use. Running this by hand from a
  # v* tag signs and checks without publishing, to try it. What signing covers: packaging/README.md.
  sign-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, windows]  # python: a release's tag is the version
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write  # signs in to Azure, to sign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            packaging/windows
            packaging/icons
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-app
          path: ${{ runner.temp }}\Chatmon
      - *inno-setup
      - name: Microsoft's ArtifactSigning module, checked to be signed by Microsoft
        shell: pwsh
        run: |
          Install-Module ArtifactSigning -RequiredVersion 0.1.8 -Repository PSGallery -Scope CurrentUser -Force
          $module = Get-Module -ListAvailable ArtifactSigning | Where-Object Version -eq 0.1.8
          $scripts = Get-ChildItem $module.ModuleBase -Recurse -Include *.psm1, *.psd1
          if (-not $scripts) { throw "No ArtifactSigning 0.1.8 in $($module.ModuleBase)" }
          foreach ($script in $scripts) {
            $sig = Get-AuthenticodeSignature $script.FullName
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notlike "CN=Microsoft Corporation,*") { throw "$($script.Name): $($sig.Status) $($sig.SignerCertificate.Subject)" }
          }
      - name: How this job signs
        shell: pwsh
        run: |
          # signtool, through Microsoft's module, signed in as the Azure CLI is: SHA-256, and timestamped,
          # or the signature would end with the certificate. One file (Inno Setup passes each, quoted, as $f),
          # or -Catalog, a list of them relative to it.
          Set-Content (Join-Path $env:RUNNER_TEMP "sign.ps1") -Encoding utf8 -Value @'
          param([string]$File, [string]$Catalog)
          $ErrorActionPreference = "Stop"
          Import-Module ArtifactSigning -RequiredVersion 0.1.8
          $options = @{ Timeout = 1800 }
          foreach ($c in "Environment", "WorkloadIdentity", "ManagedIdentity", "SharedTokenCache", "VisualStudio",
            "VisualStudioCode", "AzurePowerShell", "AzureDeveloperCli", "InteractiveBrowser") { $options["Exclude${c}Credential"] = $true }
          if ($Catalog) { $options["FilesCatalog"] = $Catalog } else { $options["Files"] = $File }
          Invoke-ArtifactSigning @options `
            -Endpoint https://wus.codesigning.azure.net/ -CodeSigningAccountName scnetsolutions -CertificateProfileName SAKUtility `
            -FileDigest SHA256 -TimestampRfc3161 http://timestamp.acs.microsoft.com -TimestampDigest SHA256 `
            -Description Chatmon -DescriptionUrl https://github.com/RandyNorthrup/chatmon
          '@
      - name: Sign in to Azure, to sign
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign Chatmon's programs, and each library its maker didn't
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP "Chatmon"
          $binaries = Get-ChildItem $app -Recurse -File -Include *.exe, *.dll, *.pyd
          $unsigned = $binaries | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq "NotSigned" }
          if ("chatmon.exe", "chatmonw.exe" | Where-Object { "$app\$_" -notin $unsigned.FullName }) { throw "chatmon.exe and chatmonw.exe should come unsigned" }
          $catalog = Join-Path $env:RUNNER_TEMP "unsigned.txt"
          Set-Content $catalog -Encoding utf8 -Value ($unsigned | ForEach-Object { [IO.Path]::GetRelativePath($env:RUNNER_TEMP, $_.FullName) })
          Write-Host "$($unsigned.Count) of $($binaries.Count) to sign"
          & pwsh -NoProfile -NonInteractive -File (Join-Path $env:RUNNER_TEMP "sign.ps1") -Catalog $catalog
          if ($LASTEXITCODE) { throw "Signing failed: $LASTEXITCODE" }
          foreach ($binary in $binaries) {
            $sig = Get-AuthenticodeSignature $binary.FullName
            if ($sig.Status -ne "Valid") { throw "$($binary.FullName): $($sig.Status) $($sig.StatusMessage)" }
            if ($binary.FullName -in $unsigned.FullName -and ($sig.SignerCertificate.Subject -notmatch "^CN=Randy Northrup(,|$)" -or -not $sig.TimeStamperCertificate)) {
              throw "$($binary.FullName): signed by $($sig.SignerCertificate.Subject), timestamp $($sig.TimeStamperCertificate.Subject)"
            }
          }
      - name: Build the installer, signing it and its uninstaller
        shell: pwsh
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          $sign = Join-Path $env:RUNNER_TEMP "sign.ps1"
          if ($sign.Contains(" ")) { throw "Inno Setup can't be handed $sign" }
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Not a version: $env:VERSION" }
          $iscc = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$env:RUNNER_TEMP\Chatmon" "/DOutputDir=$env:RUNNER_TEMP\dist" `
            "/DSignWith=artifactsign" "/Sartifactsign=pwsh -NoProfile -NonInteractive -File $sign `$f" packaging\windows\chatmon.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed: $LASTEXITCODE" }
      - name: The installer is signed by Randy Northrup, and timestamped
        shell: pwsh
        run: |
          $setup = Get-Item "$env:RUNNER_TEMP\dist\Chatmon-*-windows-x64-setup.exe"
          $sig = Get-AuthenticodeSignature $setup.FullName
          if ($sig.Status -ne "Valid") { throw "Its signature is $($sig.Status): $($sig.StatusMessage)" }
          if ($sig.SignerCertificate.Subject -notmatch "^CN=Randy Northrup(,|$)") { throw "Signed by someone else: $($sig.SignerCertificate.Subject)" }
          if (-not $sig.TimeStamperCertificate) { throw "Its signature has no timestamp" }
          Write-Host "$($setup.Name): signed by $($sig.SignerCertificate.Subject), timestamped by $($sig.TimeStamperCertificate.Subject)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signed
          path: ${{ runner.temp }}\dist\*.exe
          retention-days: 1
          if-no-files-found: error

  # The signed installer, put through what the unsigned one was, and every program and library it installs
  # checked signed.
  test-signed-windows:
    needs: [windows, sign-windows]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-signed
          path: dist
      - name: Install it, run it, uninstall it
        shell: pwsh
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: ./packaging/windows/test-install.ps1 (Get-Item dist/Chatmon-*-windows-x64-setup.exe).FullName $env:VERSION
      - name: Chatmon's own updater would install it
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r packaging/requirements-test.txt  # the Qt that ships, hash-locked
          $setup = (Get-Item dist/Chatmon-*-windows-x64-setup.exe).FullName
          python -c "import sys; from pathlib import Path; from chatmon import updates; f = Path(sys.argv[1]); print(updates.windows_signer(f)); why = updates.verify(f, updates.sha256(f), updates.WINDOWS); sys.exit(why)" $setup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]  # Apple silicon, Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - *source-date
      - *build-tools
      - run: python packaging/build.py macos
      - name: Prepare root-owned PATH directories for installer tests
        run: |
          # Homebrew's writable prefix intentionally gets no privileged launcher. This smoke test exercises
          # the secure-prefix path; test_packaging.py separately proves unsafe prefixes remain untouched.
          for dir in /usr/local /usr/local/bin; do
            [ ! -L "$dir" ] || { echo "$dir is a symlink, not an installer fixture"; exit 1; }
            sudo mkdir -p "$dir"
            sudo chown root:wheel "$dir"
            sudo chmod -N "$dir"
            sudo chmod 755 "$dir"
            ls -ldn "$dir"
          done
      - name: The last release's .pkg, for this one to upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo intel)
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select((.draft | not) and any(.assets[]; .name | endswith(\"-macos-$arch.pkg\")))][0].tag_name")
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "*-macos-$arch.pkg" --dir "$RUNNER_TEMP/last"
          sudo installer -pkg "$RUNNER_TEMP"/last/*.pkg -target /
      - name: Install this .pkg over it, run it
        run: |
          sudo installer -pkg dist/Chatmon-*.pkg -target /
          ls -ldn /usr/local /usr/local/bin
          ls -l /usr/local/bin/chatmon || true
          test -x /usr/local/bin/chatmon
          python packaging/build.py smoke /usr/local/bin/chatmon /Applications/Chatmon.app/Contents/MacOS/Chatmon --version "$(python packaging/build.py version)"
      - name: Root's side of updating is in the app, the app is root's, and its check refuses what it can't read
        run: |
          app=/Applications/Chatmon.app
          test -x "$app/Contents/Resources/install-update"
          [ "$(stat -f %u "$app")" = 0 ] || { echo "Chatmon.app belongs to uid $(stat -f %u "$app"), not root"; exit 1; }
          status=0
          "$app/Contents/MacOS/Chatmon" verify-update macos missing.pkg missing.txt missing.sig || status=$?
          [ "$status" = 3 ] || { echo "verify-update exited $status on files that aren't there, not 3 (refused)"; exit 1; }
      - name: The .dmg holds the app
        run: |
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/Chatmon-*.dmg
          test -x "$mount/Chatmon.app/Contents/MacOS/Chatmon" && test -L "$mount/Applications"
          hdiutil detach "$mount"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-macos-${{ matrix.runner }}
          path: |
            dist/*.pkg
            dist/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *source-date
      - run: sudo sh packaging/linux/get-nfpm.sh
      - run: python3 packaging/build.py linux
      - name: Install each on a fresh system, run it, remove it
        run: |
          version=$(python3 packaging/build.py version)
          for image in ubuntu:24.04 debian:trixie; do
            echo "::group::$image"
            docker run --rm -v "$PWD:/src:ro" "$image" sh -ec "
              # Ubuntu's archive hosts' DNS has failed for hours at a time: kernel.org's mirror (apt checks the signatures).
              apt-get update -qq --error-on=any || { sed -i -E 's#http://(archive|security)\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' /etc/apt/sources.list.d/*.sources 2>/dev/null; apt-get update -qq; }
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /src/dist/chatmon_*_all.deb >/dev/null
              python3 /src/packaging/build.py smoke chatmon chatmon --version $version
              # Root's side of updating, for real: a signed newer package installs, and nothing else does.
              sh /src/packaging/linux/test-install-update.sh /src/dist/chatmon_*_all.deb
              apt-get remove -y -qq chatmon >/dev/null
              test ! -e /usr/lib/chatmon"
            echo "::endgroup::"
          done
          echo "::group::fedora:44"
          docker run --rm -v "$PWD:/src:ro" fedora:44 sh -ec "
            dnf install -y -q /src/dist/chatmon-*.noarch.rpm >/dev/null
            python3 /src/packaging/build.py smoke chatmon chatmon --version $version
            sh /src/packaging/linux/test-install-update.sh /src/dist/chatmon-*.noarch.rpm
            dnf remove -y -q chatmon >/dev/null
            test ! -e /usr/lib/chatmon"
          echo "::endgroup::"
      - name: The last release's packages, for this one to update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select((.draft | not) and any(.assets[]; .name | endswith("_all.deb")))][0].tag_name')
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "*_all.deb" --pattern "*.noarch.rpm" --dir "$RUNNER_TEMP/last"
          echo "Updating from $tag"
      - name: Install the last release, update it to this one with its own updater, run it
        run: |
          version=$(python3 packaging/build.py version)
          # As Chatmon's updater does: the install-update of the Chatmon already installed (pkexec runs it as
          # root) installs the new package after checking a signed list itself. The canonical test harness
          # supplies an ephemeral trust key inside each throwaway container; no release signing secret is used.
          echo "::group::ubuntu:24.04"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/last:/last:ro" ubuntu:24.04 sh -ec "
            apt-get update -qq --error-on=any || { sed -i -E 's#http://(archive|security)\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' /etc/apt/sources.list.d/*.sources 2>/dev/null; apt-get update -qq; }
            apt-get install -y -qq python3 >/dev/null
            sh /src/packaging/linux/test-install-update.sh /src/dist/chatmon_*_all.deb /last/chatmon_*_all.deb
            dpkg-query -W -f '\${Version}\n' chatmon
            python3 /src/packaging/build.py smoke chatmon chatmon --version $version"
          echo "::endgroup::"
          echo "::group::fedora:44"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/last:/last:ro" fedora:44 sh -ec "
            dnf install -y -q python3 >/dev/null
            sh /src/packaging/linux/test-install-update.sh /src/dist/chatmon-*.noarch.rpm /last/chatmon-*.noarch.rpm
            rpm -q chatmon
            python3 /src/packaging/build.py smoke chatmon chatmon --version $version"
          echo "::endgroup::"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # The list of every file's checksum, signed with Chatmon's release key (a secret of the `release`
  # environment, v* tags only): Chatmon installs an update only if this signature and its checksum hold.
  checksums:
    if: github.event_name == 'push'
    needs: [python, test-signed-windows, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: chatmon/releasecheck.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: List and sign every file's checksum
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          DIST: ${{ runner.temp }}/dist
        run: |
          cd "$DIST"
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          umask 077
          key="$RUNNER_TEMP/release.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          # The key that signed is the one Chatmon trusts, and the signature checks out with it.
          public=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          grep -q "\"$public\"" "$GITHUB_WORKSPACE/chatmon/releasecheck.py" || { echo "RELEASE_SIGNING_KEY isn't a key in RELEASE_KEYS"; exit 1; }
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release.pub"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release.pub" -rawin -in SHA256SUMS.txt -sigfile SHA256SUMS.txt.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-checksums
          path: |
            ${{ runner.temp }}/dist/SHA256SUMS.txt
            ${{ runner.temp }}/dist/SHA256SUMS.txt.sig
          if-no-files-found: error

  # Every file gets a signed statement of where and how it was built, made with a short-lived Sigstore
  # certificate for this run: `gh attestation verify FILE --repo RandyNorthrup/chatmon` checks one.
  attest:
    if: github.event_name == 'push'
    needs: [checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # the certificate is issued to this run
      attestations: write  # the statements are kept with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  # The release is made as a draft, with its notes (chatmon/changelog.md) and every file, and published only
  # then: nobody, and no Chatmon looking for an update, ever sees it without its files.
  publish:
    if: github.event_name == 'push'
    needs: [checksums, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /packaging/build.py
            /chatmon/__init__.py
            /chatmon/changelog.py
            /chatmon/changelog.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Draft the release with every file, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 packaging/build.py version)
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG, but chatmon/__init__.py says $version"; exit 1; }
          python3 packaging/build.py notes "$version" > "$RUNNER_TEMP/notes.md"
          ls -l dist
          test -s dist/SHA256SUMS.txt && test -s dist/SHA256SUMS.txt.sig
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            # An earlier run stopped part way: finish its draft. A published release is never changed.
            [ "$draft" = true ] || { echo "$TAG is already published"; exit 1; }
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "Chatmon $version" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          fi
          attached=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | sort | join(" ")')
          expected=$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | paste -sd ' ' -)
          [ "$attached" = "$expected" ] || { echo "The draft holds: $attached"; echo "It should hold: $expected"; exit 1; }
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
