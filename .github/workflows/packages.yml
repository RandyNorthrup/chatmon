name: Packages

# Chatmon's installers and packages, each installed on a fresh machine and run before it's kept:
# Windows (Inno Setup), macOS (.pkg and .dmg, Apple silicon and Intel), Linux (.deb and .rpm), and the
# wheel and sdist. Publishing a release signs the Windows installer and adds them all to it; a pull
# request that touches packaging, or running this by hand, only builds and checks them, unsigned
# (they're kept with the run). Actions are pinned to commits: what runs here can't change under a tag.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: The release is the version the code says
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python packaging/build.py version)
          [ "$TAG" = "v$version" ] || { echo "Release $TAG, but chatmon/__init__.py says $version"; exit 1; }
      - run: python -m pip install build==1.6.1
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-python
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 90  # Nuitka compiles Chatmon twice: chatmon.exe and chatmonw.exe
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r packaging/requirements.txt
      - &inno-setup
        name: Inno Setup 6.7.3, checked to be signed by its maker
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download is-6_7_3 --repo jrsoftware/issrc --pattern innosetup-6.7.3.exe --dir $env:RUNNER_TEMP
          $setup = Join-Path $env:RUNNER_TEMP innosetup-6.7.3.exe
          $sig = Get-AuthenticodeSignature $setup
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notlike "CN=Pyrsys B.V.*") { throw "Unexpected signature: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/SP-" -Wait
      - run: python packaging/build.py windows
      - id: version
        shell: pwsh
        run: '"version=$(python packaging/build.py version)" >> $env:GITHUB_OUTPUT'
      - name: The last release's installer, for this one to upgrade
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(any(.assets[]; .name | endswith("-windows-x64-setup.exe")))][0].tag_name')
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "*-windows-x64-setup.exe" --dir "$RUNNER_TEMP/last"
      - name: Install the last release, then this one over it, run it, uninstall it
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $last = Get-Item "$env:RUNNER_TEMP\last\*-windows-x64-setup.exe"
          $p = Start-Process $last.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/TASKS=startmenu" -Wait -PassThru
          if ($p.ExitCode) { throw "$($last.Name) failed: $($p.ExitCode)" }
          Write-Host "Installed $($last.Name)"
          ./packaging/windows/test-install.ps1 (Get-Item dist/Chatmon-*-windows-x64-setup.exe).FullName $env:VERSION -Unsigned
      - name: Keep the unsigned installer with the run
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: dist/*.exe
          if-no-files-found: error
      - name: Hand on Chatmon, for its installer to be built signed
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app
          path: build/nuitka/Chatmon
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Signs Chatmon's programs, chatmon.exe and chatmonw.exe, and every library beside them not already
  # signed by its maker, then has Inno Setup build the installer around them again and sign it and its
  # uninstaller as it makes them: all with Randy Northrup's Artifact Signing certificate (Azure). This job
  # alone can sign, and runs nothing from PyPI and none of Chatmon: only pinned actions, Inno Setup and
  # Microsoft's signing module (each checked to be signed by its maker, and the module fetches Microsoft's
  # signtool at the versions it names), compiling packaging/windows/chatmon.iss. Azure trusts GitHub's
  # sign-in only from the `release` environment, which only v* tags can use. Running this by hand from a
  # v* tag signs and checks without publishing, to try it. What signing covers: packaging/README.md.
  sign-windows:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: [python, windows]  # python: a release's tag is the version
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write  # signs in to Azure, to sign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            packaging/windows
            packaging/icons
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-app
          path: ${{ runner.temp }}\Chatmon
      - *inno-setup
      - name: Microsoft's ArtifactSigning module, checked to be signed by Microsoft
        shell: pwsh
        run: |
          Install-Module ArtifactSigning -RequiredVersion 0.1.8 -Repository PSGallery -Scope CurrentUser -Force
          $module = Get-Module -ListAvailable ArtifactSigning | Where-Object Version -eq 0.1.8
          $scripts = Get-ChildItem $module.ModuleBase -Recurse -Include *.psm1, *.psd1
          if (-not $scripts) { throw "No ArtifactSigning 0.1.8 in $($module.ModuleBase)" }
          foreach ($script in $scripts) {
            $sig = Get-AuthenticodeSignature $script.FullName
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notlike "CN=Microsoft Corporation,*") { throw "$($script.Name): $($sig.Status) $($sig.SignerCertificate.Subject)" }
          }
      - name: How this job signs
        shell: pwsh
        run: |
          # signtool, through Microsoft's module, signed in as the Azure CLI is: SHA-256, and timestamped,
          # or the signature would end with the certificate. One file (Inno Setup passes each, quoted, as $f),
          # or -Catalog, a list of them relative to it.
          Set-Content (Join-Path $env:RUNNER_TEMP "sign.ps1") -Encoding utf8 -Value @'
          param([string]$File, [string]$Catalog)
          $ErrorActionPreference = "Stop"
          Import-Module ArtifactSigning -RequiredVersion 0.1.8
          $options = @{ Timeout = 1800 }
          foreach ($c in "Environment", "WorkloadIdentity", "ManagedIdentity", "SharedTokenCache", "VisualStudio",
            "VisualStudioCode", "AzurePowerShell", "AzureDeveloperCli", "InteractiveBrowser") { $options["Exclude${c}Credential"] = $true }
          if ($Catalog) { $options["FilesCatalog"] = $Catalog } else { $options["Files"] = $File }
          Invoke-ArtifactSigning @options `
            -Endpoint https://wus.codesigning.azure.net/ -CodeSigningAccountName scnetsolutions -CertificateProfileName SAKUtility `
            -FileDigest SHA256 -TimestampRfc3161 http://timestamp.acs.microsoft.com -TimestampDigest SHA256 `
            -Description Chatmon -DescriptionUrl https://github.com/RandyNorthrup/chatmon
          '@
      - name: Sign in to Azure, to sign
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign Chatmon's programs, and each library its maker didn't
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP "Chatmon"
          $binaries = Get-ChildItem $app -Recurse -File -Include *.exe, *.dll, *.pyd
          $unsigned = $binaries | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq "NotSigned" }
          if ("chatmon.exe", "chatmonw.exe" | Where-Object { "$app\$_" -notin $unsigned.FullName }) { throw "chatmon.exe and chatmonw.exe should come unsigned" }
          $catalog = Join-Path $env:RUNNER_TEMP "unsigned.txt"
          Set-Content $catalog -Encoding utf8 -Value ($unsigned | ForEach-Object { [IO.Path]::GetRelativePath($env:RUNNER_TEMP, $_.FullName) })
          Write-Host "$($unsigned.Count) of $($binaries.Count) to sign"
          & pwsh -NoProfile -NonInteractive -File (Join-Path $env:RUNNER_TEMP "sign.ps1") -Catalog $catalog
          if ($LASTEXITCODE) { throw "Signing failed: $LASTEXITCODE" }
          foreach ($binary in $binaries) {
            $sig = Get-AuthenticodeSignature $binary.FullName
            if ($sig.Status -ne "Valid") { throw "$($binary.FullName): $($sig.Status) $($sig.StatusMessage)" }
            if ($binary.FullName -in $unsigned.FullName -and ($sig.SignerCertificate.Subject -notmatch "^CN=Randy Northrup(,|$)" -or -not $sig.TimeStamperCertificate)) {
              throw "$($binary.FullName): signed by $($sig.SignerCertificate.Subject), timestamp $($sig.TimeStamperCertificate.Subject)"
            }
          }
      - name: Build the installer, signing it and its uninstaller
        shell: pwsh
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          $sign = Join-Path $env:RUNNER_TEMP "sign.ps1"
          if ($sign.Contains(" ")) { throw "Inno Setup can't be handed $sign" }
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Not a version: $env:VERSION" }
          $iscc = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$env:RUNNER_TEMP\Chatmon" "/DOutputDir=$env:RUNNER_TEMP\dist" `
            "/DSignWith=artifactsign" "/Sartifactsign=pwsh -NoProfile -NonInteractive -File $sign `$f" packaging\windows\chatmon.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed: $LASTEXITCODE" }
      - name: The installer is signed by Randy Northrup, and timestamped
        shell: pwsh
        run: |
          $setup = Get-Item "$env:RUNNER_TEMP\dist\Chatmon-*-windows-x64-setup.exe"
          $sig = Get-AuthenticodeSignature $setup.FullName
          if ($sig.Status -ne "Valid") { throw "Its signature is $($sig.Status): $($sig.StatusMessage)" }
          if ($sig.SignerCertificate.Subject -notmatch "^CN=Randy Northrup(,|$)") { throw "Signed by someone else: $($sig.SignerCertificate.Subject)" }
          if (-not $sig.TimeStamperCertificate) { throw "Its signature has no timestamp" }
          Write-Host "$($setup.Name): signed by $($sig.SignerCertificate.Subject), timestamped by $($sig.TimeStamperCertificate.Subject)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signed
          path: ${{ runner.temp }}\dist\*.exe
          retention-days: 1
          if-no-files-found: error

  # The signed installer, put through what the unsigned one was, and every program and library it installs
  # checked signed.
  test-signed-windows:
    needs: [windows, sign-windows]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-signed
          path: dist
      - name: Install it, run it, uninstall it
        shell: pwsh
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: ./packaging/windows/test-install.ps1 (Get-Item dist/Chatmon-*-windows-x64-setup.exe).FullName $env:VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]  # Apple silicon, Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r packaging/requirements.txt
      - run: python packaging/build.py macos
      - name: The last release's .pkg, for this one to upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo intel)
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(any(.assets[]; .name | endswith(\"-macos-$arch.pkg\")))][0].tag_name")
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "*-macos-$arch.pkg" --dir "$RUNNER_TEMP/last"
          sudo installer -pkg "$RUNNER_TEMP"/last/*.pkg -target /
      - name: Install this .pkg over it, run it
        run: |
          sudo installer -pkg dist/Chatmon-*.pkg -target /
          test -x /usr/local/bin/chatmon
          python packaging/build.py smoke /usr/local/bin/chatmon /Applications/Chatmon.app/Contents/MacOS/Chatmon --version "$(python packaging/build.py version)"
      - name: The .dmg holds the app
        run: |
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/Chatmon-*.dmg
          test -x "$mount/Chatmon.app/Contents/MacOS/Chatmon" && test -L "$mount/Applications"
          hdiutil detach "$mount"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-macos-${{ matrix.runner }}
          path: |
            dist/*.pkg
            dist/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo sh packaging/linux/get-nfpm.sh
      - run: python3 packaging/build.py linux
      - name: Install each on a fresh system, run it, remove it
        run: |
          version=$(python3 packaging/build.py version)
          for image in ubuntu:24.04 debian:trixie; do
            echo "::group::$image"
            docker run --rm -v "$PWD:/src:ro" "$image" sh -ec "
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /src/dist/chatmon_*_all.deb >/dev/null
              python3 /src/packaging/build.py smoke chatmon chatmon --version $version
              apt-get remove -y -qq chatmon >/dev/null
              test ! -e /usr/lib/chatmon"
            echo "::endgroup::"
          done
          echo "::group::fedora:44"
          docker run --rm -v "$PWD:/src:ro" fedora:44 sh -ec "
            dnf install -y -q /src/dist/chatmon-*.noarch.rpm >/dev/null
            python3 /src/packaging/build.py smoke chatmon chatmon --version $version
            dnf remove -y -q chatmon >/dev/null
            test ! -e /usr/lib/chatmon"
          echo "::endgroup::"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: [python, test-signed-windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
