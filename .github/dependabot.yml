# Weekly pull requests for newer actions, each held back until it has been out two weeks (cooldown), the same rule
# as for moving a pin by hand. Every one runs CI before it can be merged.
#
# No pip entries. Each packaging/requirements*.txt is a `uv pip compile --universal` lock, every platform's packages
# in one file, and Dependabot can't make one: it locks pip lists with pip-compile, for the one platform it runs on
# (its pull requests dropped the macOS build's packages and nuitka's Windows marker), and its uv support covers only
# uv.lock. The Python pins move with .github/workflows/pins.yml instead: each week it runs packaging/pins.py, which
# asks uv what each lock would move to under the same cooldown and keeps one issue with the report while something
# can; `python packaging/pins.py --apply` moves them. Dependabot's alerts and security updates are repository
# settings and still come without a pip entry; lock such a pull request again with uv before merging it
# (CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
