[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chatmon"
dynamic = ["version"]
description = "Chatmon: little desktop companions that answer with any AI and react to your coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Randy Northrup" }]
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.5"]
keywords = ["chatmon", "desktop pet", "companion", "ai", "agents", "claude", "codex", "gemini", "reminders"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Desktop Environment",
]

[project.optional-dependencies]
battery = ["psutil"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/RandyNorthrup/chatmon"
Issues = "https://github.com/RandyNorthrup/chatmon/issues"

[project.scripts]
chatmon = "chatmon.cli:main"
penguin-companion = "chatmon.cli:main"  # the old name, kept for one release

[project.gui-scripts]
chatmonw = "chatmon.cli:main"  # on Windows, Chatmon without a console window: what autostart runs

[tool.setuptools]
packages = ["chatmon"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "chatmon.__version__" }

[tool.setuptools.package-data]
chatmon = [
    "anim/*.png",
    "anim/manifest.json",
    "anim/*/*.png",
    "anim/*/manifest.json",
    "bubbles/*.png",
    "bubbles/manifest.json",
    "changelog.md",
    "integrations/claude/.claude-plugin/marketplace.json",
    "integrations/claude/chatmon/.claude-plugin/plugin.json",
    "integrations/claude/chatmon/hooks/hooks.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 170
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]
